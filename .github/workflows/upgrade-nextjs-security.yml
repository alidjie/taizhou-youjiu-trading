name: Patch Next.js security release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-nextjs-security.yml"

permissions:
  contents: write

concurrency:
  group: nextjs-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Upgrade framework and React security fixes
        run: |
          npm install --save-exact next@15.5.29 react@19.0.6 react-dom@19.0.6
          npm install --save-dev --save-exact eslint-config-next@15.5.29

      - name: Verify dependency versions
        run: |
          npm ls next react react-dom eslint-config-next

      - name: Run production build
        run: npm run build

      - name: Commit patched dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/upgrade-nextjs-security.yml
          git commit -m "Upgrade Next.js to patched security release"
          git push origin HEAD:main
